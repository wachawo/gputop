[project]
name = "gputop"
version = "0.1.0"
description = "Terminal GPU monitor for Linux: per-process VRAM, engine load and LLM memory breakdown"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "textual>=3.2",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535.133",
]

[project.scripts]
gputop = "gputop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gputop"]
